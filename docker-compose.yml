services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shiwu
      MYSQL_USER: shiwu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shiwu_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shiwu_root_local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - AI_MODE=${AI_MODE:-demo}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://shiwu:shiwu_local@mysql:3306/shiwu?charset=utf8mb4}
      - SEED_DEMO=${SEED_DEMO:-true}
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
